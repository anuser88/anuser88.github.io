<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirect</title>
</head>
<body>
    Redirecting...
    <script>
        const params = new URLSearchParams(location.search);
        const encoded = params.get("to");

        if (encoded) {
            try {
                const url = decodeURIComponent(
                    Array.from(atob(encoded))
                        .map(c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0'))
                        .join('')
                );
                location.replace(url);
            } catch (e) {
                document.body.textContent = "Invalid Base64";
            }
        } else {
            document.body.textContent = "Missing parameter";
        }
    </script>
</body>
</html>
